<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5A1F" />
    <meta name="description" content="Goldstar Shoes, made in Nepal: trek boots, everyday casuals and new arrivals for men and women. Order online and pay cash on delivery." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goldstar" />
    <meta property="og:title" content="Goldstar Shoes — Made in Nepal" />
    <meta property="og:description" content="Trek boots, everyday casuals and new arrivals, made in Nepal. Order online with cash on delivery." />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Goldstar, made in Nepal: Walk the world!! Four friends in Goldstar sneakers on a blue arch." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Goldstar Shoes — Made in Nepal</title>
    <script>
      // No loading screen: the page paints straight away. First paint takes the route's ground: the white of
      // the landing (/), the tangerine hero of the G10 story (/g10), the warm shop ground elsewhere. The landing has no
      // 3D: it preloads its hero photo (the LCP; only on /). The story preloads its poster and the
      // boot for this device tier (same rules as src/three/tier.js, fetched once the poster has painted) so the 3D can fade
      // in over the poster.
      (function () {
        var p = location.pathname;
        var landing = p === '/';
        var story = p === '/g10' || p === '/g10/';
        var admin = '#F6F4EF';
        if (p.indexOf('/admin') === 0) { try { if ((JSON.parse(localStorage.getItem('gs-admin-prefs')) || {}).mode === 'dark') admin = '#100F0D'; } catch (e) {} }
        document.documentElement.style.background = landing ? '#FFFFFF' : story ? '#FF5A1F' : p.indexOf('/admin') === 0 ? admin : '#F6F2EA';
        if (!landing && !story) return;
        function pre(href, as, type, media, low) { var l = document.createElement('link'); l.rel = 'preload'; l.as = as; l.href = href; if (type) l.type = type; if (media) l.media = media; if (as === 'fetch' || as === 'font') l.crossOrigin = 'anonymous'; if (as === 'image') l.fetchPriority = 'high'; if (low) l.fetchPriority = 'low'; document.head.appendChild(l); return l; }
        if (landing) {
          try { document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF'); } catch (e) {}
          var h = pre('/img/landing/group-904.webp', 'image', 'image/webp');
          h.setAttribute('imagesrcset', '/img/landing/group-600.webp 600w, /img/landing/group-904.webp 904w');
          h.setAttribute('imagesizes', '(max-width: 899.95px) 78vw, 38vw');
          pre('/fonts/caveat-brush-hero.woff2', 'font', 'font/woff2'); // the hero headline's brush face (no CLS: metric-matched fallback)
          return;
        }
        pre('/img/hero/boot-phone.webp', 'image', 'image/webp', '(max-width: 899.95px)');
        pre('/img/hero/boot-desktop.webp', 'image', 'image/webp', '(min-width: 900px)');
        try {
          var n = navigator, q = new URLSearchParams(location.search).get('tier'), mm = window.matchMedia;
          if (q === 'static' || mm('(prefers-reduced-motion: reduce)').matches) return;
          if (!q && ((n.connection && n.connection.saveData) || n.deviceMemory <= 2 || n.hardwareConcurrency <= 2)) return;
          var full = q ? q === 'full' : !(mm('(pointer: coarse)').matches || innerWidth < 900);
          // The boot starts once the poster has painted (first LCP entry, or 2.5 s at the latest), so the 1.4 to 3.5 MB model
          // never competes with the poster, the scripts or the styles for the first paint; it is still in flight long
          // before the first scroll chapter.
          var glb = full ? '/models/g10-hd.glb' : '/models/g10-hd-mobile.glb', fired = false;
          var go = function () { if (fired) return; fired = true; pre(glb, 'fetch', null, null, true); };
          try { new PerformanceObserver(function () { setTimeout(go, 0); }).observe({ type: 'largest-contentful-paint', buffered: true }); } catch (e) {}
          setTimeout(go, 2500);
        } catch (e) {}
      })();
    </script>
    <style>
      body{margin:0}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
