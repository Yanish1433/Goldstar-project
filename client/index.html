<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF5A1F" />
    <meta name="description" content="A concept prototype of a Goldstar Shoes Nepal website: the G10-401 trek shoe told as a scroll-driven 3D story." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230B0A08'/%3E%3Cpath d='M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z' fill='%23E2B857'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="/loader/loader-walk.webp" type="image/webp" />
    <title>Goldstar concept</title>
    <script>
      // First visit of the session only: a repeat visit skips the loader (flag is set when it exits).
      try { if (sessionStorage.getItem('gs-loader')) document.documentElement.className += ' gl-skip'; else document.documentElement.className += ' gl-lock'; } catch (e) { document.documentElement.className += ' gl-lock'; }
    </script>
    <style>
      html,body{background:#0B0A08;margin:0}
      html.gl-lock{overflow:hidden}
      html.gl-skip #gs-loader{display:none}
      /* ---- Goldstar loader: paints before the JS bundle. Hero colours: tangerine #FF5A1F, ink #1A0B05. ---- */
      #gs-loader{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#1A0B05;
        background:radial-gradient(90% 70% at 50% 42%,#FF6A33 0%,#FF5A1F 55%,#F2511A 100%);font-family:"Archivo Variable",Archivo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
        clip-path:inset(0 0 0 0)}
      #gs-loader.gl-exit{animation:gl-wipe .85s .4s cubic-bezier(.7,0,.2,1) forwards}
      @keyframes gl-wipe{to{clip-path:inset(0 0 100% 0)}}
      .gl-stage{position:relative;width:300px;height:200px;flex:none}
      .gl-ground{position:absolute;left:50%;top:178px;width:100vw;height:2px;transform:translateX(-50%);
        background:linear-gradient(90deg,transparent,rgba(26,11,5,.42) 22%,rgba(26,11,5,.42) 78%,transparent)}
      .gl-fp{position:absolute;width:122px;height:44px;left:0;top:0;opacity:0;will-change:transform,opacity;animation:gl-stamp 4.4s linear infinite both}
      .gl-fp svg{display:block;width:100%;height:100%;fill:#1A0B05}
      .gl-fp.n{left:174.9px;top:177.5px;--x:174.9px}
      .gl-fp.f{left:181.8px;top:160.5px}
      @keyframes gl-stamp{
        0%{opacity:0;transform:translate(-50%,-50%) translateX(0) scale(1.22,.62)}
        3%{opacity:.34;transform:translate(-50%,-50%) translateX(-4px) scale(1,.5)}
        45%{opacity:.3}
        100%{opacity:0;transform:translate(-50%,-50%) translateX(-630px) scale(1,.5)}}
      .gl-boots{position:absolute;inset:0;background:url(/loader/loader-walk.webp) 0 0/1800px 800px no-repeat;opacity:0;filter:brightness(1.18) contrast(1.04);
        animation:gl-in .35s .05s ease-out forwards,gl-bx .275s steps(6) infinite,gl-by 1.1s steps(4) infinite;transition:transform .8s cubic-bezier(.5,0,.9,.45)}
      @keyframes gl-in{to{opacity:1}}
      @keyframes gl-bx{to{background-position-x:-1800px}}
      @keyframes gl-by{to{background-position-y:-800px}}
      #gs-loader.gl-exit .gl-boots{transform:translateX(70vw)}
      .gl-brand{margin-top:6px;display:flex;align-items:baseline;gap:14px;line-height:1}
      .gl-word{font-weight:800;font-size:30px;letter-spacing:.2em;text-indent:.2em}
      .gl-ne{font-family:Mukta,"Noto Sans Devanagari","Nirmala UI",sans-serif;font-weight:600;font-size:16px;opacity:.72}
      .gl-meter{margin-top:22px;width:min(240px,64vw);display:flex;flex-direction:column;align-items:center;gap:10px}
      .gl-track{position:relative;width:100%;height:2px;background:rgba(26,11,5,.2);overflow:hidden}
      .gl-fill{position:absolute;inset:0;background:#1A0B05;transform:scaleX(0);transform-origin:0 50%}
      .gl-pct{font-size:12px;font-weight:700;letter-spacing:.18em;font-variant-numeric:tabular-nums;opacity:.85}
      #gs-loader.gl-exit .gl-brand,#gs-loader.gl-exit .gl-meter{opacity:0;transition:opacity .3s}
      @media (min-width:900px){.gl-stage{transform:scale(1.5);margin:70px 0 36px}.gl-word{font-size:36px}.gl-meter{width:280px}}
      @media (max-width:420px){.gl-stage{transform:scale(.82)}.gl-word{font-size:25px}}
      @media (prefers-reduced-motion:reduce){
        .gl-boots{animation:gl-in .2s forwards;background-position:-600px 0}
        .gl-fp{display:none}
        #gs-loader.gl-exit{animation:gl-fade .4s forwards}
        #gs-loader.gl-exit .gl-boots{transform:none}
        @keyframes gl-fade{to{opacity:0}}}
    </style>
  </head>
  <body>
    <div id="gs-loader" role="progressbar" aria-label="Loading Goldstar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
          <!-- Goldstar sole print: diamond lugs (fore + heel), plain arch, ridges at toe and heel (after the G10-401 outsole). -->
          <pattern id="gs-dia" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#fff"/><rect x="5" y="5" width="6" height="6" fill="#000"/></pattern>
          <clipPath id="gs-sole"><path d="M10 38C8 20 22 11 42 11L94 19C112 22 126 6 160 6C190 6 199 24 197 38C195 54 177 63 150 63C126 63 112 52 94 52L48 59C26 63 11 54 10 38Z"/></clipPath>
          <mask id="gs-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="72">
            <g clip-path="url(#gs-sole)">
              <rect width="200" height="72" fill="#fff"/>
              <rect x="22" y="0" width="52" height="72" fill="url(#gs-dia)"/>
              <rect x="112" y="0" width="64" height="72" fill="url(#gs-dia)"/>
              <rect x="74" y="0" width="38" height="72" fill="#fff"/>
              <path d="M0 0h200v72H0z" fill="none"/>
              <g fill="#000"><rect x="14" y="14" width="5" height="46" transform="skewX(-8)"/><rect x="180" y="4" width="4" height="50"/><rect x="187" y="6" width="3" height="48"/><rect x="21" y="10" width="2" height="52" transform="skewX(-8)"/></g>
            </g>
          </mask>
          <symbol id="gs-fp" viewBox="0 0 200 72"><rect width="200" height="72" mask="url(#gs-mask)"/></symbol>
        </defs>
      </svg>
      <div class="gl-stage" aria-hidden="true">
        <div class="gl-ground"></div>
        <!-- Prints: 4 staggered slots per foot (negative delays so the trail is already laid when the boots appear). -->
        <div class="gl-fp f" style="animation-delay:-3.718s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp f" style="animation-delay:-2.618s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp f" style="animation-delay:-1.518s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp f" style="animation-delay:-.418s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp n" style="animation-delay:-4.268s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp n" style="animation-delay:-3.168s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp n" style="animation-delay:-2.068s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-fp n" style="animation-delay:-.968s"><svg><use href="#gs-fp"/></svg></div>
        <div class="gl-boots"></div>
      </div>
      <div class="gl-brand"><span class="gl-word">GOLDSTAR</span><span class="gl-ne" lang="ne">गोल्डस्टार</span></div>
      <div class="gl-meter"><div class="gl-track"><div class="gl-fill"></div></div><div class="gl-pct"><span class="gl-n">0</span>%</div></div>
    </div>
    <div id="root"></div>
    <script>
      // Loader driver (runs before the bundle). Fakes an ease towards ~45% so it never sits at 0, then follows the real
      // progress that src/lib/loader.js reports through window.gsLoader. Exit: boots walk off, wipe up, remove.
      (function () {
        var L = document.getElementById('gs-loader');
        if (!L || /(^| )gl-skip( |$)/.test(document.documentElement.className)) return;
        var n = L.querySelector('.gl-n'), fill = L.querySelector('.gl-fill');
        var t0 = performance.now(), shown = 0, real = 0, ready = false, exiting = false, MIN = 1200, MAX = 8000, lastInt = -1;
        function exit() {
          if (exiting) return;
          exiting = true;
          L.classList.add('gl-exit');
          setTimeout(function () {
            try { sessionStorage.setItem('gs-loader', '1'); } catch (e) {}
            document.documentElement.className = document.documentElement.className.replace(' gl-lock', '');
            if (L.parentNode) L.parentNode.removeChild(L);
            window.gsLoader.done = true;
            window.dispatchEvent(new Event('gs:loader-done'));
          }, 1350);
        }
        function frame(now) {
          if (exiting) return;
          var t = now - t0;
          var target = ready ? 1 : Math.max(0.45 * (1 - Math.exp(-t / 700)), Math.min(real, 0.99));
          if (t >= MAX) target = 1;
          shown += Math.max(0, target - shown) * (ready || t >= MAX ? 0.2 : 0.1);
          if (target === 1 && shown > 0.995) shown = 1;
          var p = Math.round(shown * 100);
          if (p !== lastInt) { lastInt = p; n.textContent = p; L.setAttribute('aria-valuenow', p); }
          fill.style.transform = 'scaleX(' + shown + ')';
          if (shown >= 1 && t >= MIN) { exit(); return; }
          requestAnimationFrame(frame);
        }
        window.gsLoader = {
          done: false,
          set: function (p) { if (p > real) real = Math.min(1, p); },
          ready: function () { ready = true; },
        };
        requestAnimationFrame(frame);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
