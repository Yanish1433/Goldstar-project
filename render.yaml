# Render Blueprint: New -> Blueprint -> pick this repo. Free web service for the API only;
# the storefront lives on Cloudflare Pages (see docs/deploy-cloudflare.md).
services:
  - type: web
    name: goldstar-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Trust by address, not hop count: a request reaches the app through the Pages worker (2a06:98c0::/29), a Cloudflare
      # edge, Render internal (10.x) and loopback; direct requests skip the worker. Express walks X-Forwarded-For from the
      # right past these ranges to the first real visitor IP (verified live 2026-11-24; a spoofed XFF is ignored).
      # Cloudflare ranges: https://www.cloudflare.com/ips/
      - key: TRUST_PROXY
        value: "loopback,uniquelocal,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Atlas connection string, with the database name in the path: ...mongodb.net/goldstar?...
      - key: MONGODB_URI
        sync: false
      # The Pages URL (https://goldstar-3d.pages.dev), or several separated by commas.
      - key: CLIENT_ORIGIN
        sync: false
